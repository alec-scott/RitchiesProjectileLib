plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = mod_group
version = "${mod_version}+mc.${minecraft_version}-fabric"
base { archivesName = mod_id }

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' }
}

loom {
    accessWidenerPath = file("src/main/resources/${mod_id}.accesswidener")
}

dependencies {
    // 26.1 is unobfuscated: no mappings, and Loom no longer remaps (non-remap "fabric-loom" plugin).
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forgeconfigapiport_version}"
}

processResources {
    def props = [
            version              : project.version,
            minecraft_version    : minecraft_version,
            fabric_loader_version: fabric_loader_version,
            fabric_api_version   : fabric_version,
            forgeconfigapiport_version: forgeconfigapiport_version
    ]
    inputs.properties(props)
    filesMatching('fabric.mod.json') { expand props }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') { rename { "${it}_${mod_id}" } }
}
